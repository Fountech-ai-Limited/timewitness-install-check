name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the thing
        run: |
          mkdir -p dist
          tar -czf dist/widget.tar.gz README.md

      # The whole of installing TimeWitness. One line, no configuration, no secret.
      - uses: Fountech-ai-Limited/timewitness@v0
        with:
          subject: dist/widget.tar.gz
          event: build
          output: dist/widget.tar.gz.receipt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-${{ github.run_id }}" dist/widget.tar.gz dist/widget.tar.gz.receipt
          --title "Build ${{ github.run_id }}" --notes "The archive and its receipt, from run ${{ github.run_id }}."
